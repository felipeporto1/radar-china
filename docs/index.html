<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar China</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: uma resposta no topo, quatro cartões de janela, alertas do e-mail e o resto recolhido. */
:root {
  --bg: #f3f6f4; --surface: #ffffff; --raised: #eef3f0; --ink: #12201b; --muted: #5d6d66; --line: #dde6e1;
  --accent: #0b6e5b; --accent-ink: #fff; --accent-soft: #dcefe8;
  --good: #1f7a3d; --good-soft: #e1f3e6; --warn: #8a5a00; --warn-soft: #f9eed6; --bad: #b93a2b; --bad-soft: #fbe6e2;
  --s1: #2a78d6; --s2: #e87ba4; --s3: #eda100; --s4: #1baf7a; --grid: #e6ece9;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif; --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0d1513; --surface: #15201d; --raised: #1c2a26; --ink: #e9f1ee; --muted: #9fb0a9; --line: #273833;
  --accent: #4cc9a8; --accent-ink: #06201a; --accent-soft: #15352c;
  --good: #62c98a; --good-soft: #15301f; --warn: #e5b34d; --warn-soft: #33280f; --bad: #f0806f; --bad-soft: #3a1c18;
  --s1: #3987e5; --s2: #d55181; --s3: #c98500; --s4: #199e70; --grid: #22312c; color-scheme: dark;
} }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
#app { max-width: 920px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); display: grid; gap: 22px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -.015em; }
h2 { font-size: 19px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-size: 22px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px var(--body); text-decoration: none; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: 13px; font-weight: 500; }
.btn:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 8px; }
.big { font: 600 clamp(40px, 11vw, 60px)/1 var(--display); letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--raised); color: var(--muted); white-space: nowrap; }
.good { background: var(--good-soft); color: var(--good); } .ok { background: var(--accent-soft); color: var(--accent); } .warn { background: var(--warn-soft); color: var(--warn); } .bad { background: var(--bad-soft); color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.jan { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.jan .nome { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.jan .nome i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.jan .datas { font-size: 13px; color: var(--muted); }
.jan .preco { font: 600 32px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.jan .the { font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
details > summary { cursor: pointer; list-style: none; font-size: 13.5px; font-weight: 600; color: var(--accent); }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; } details[open] > summary::before { content: "▾ "; }
.det { display: grid; gap: 8px; padding-top: 8px; font-size: 13.5px; }
.lin { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.lin:last-child { border-bottom: 0; }
.lin span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.sec { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.alerta { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.alerta:last-child { border-bottom: 0; }
.alerta .as { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alerta .vl { font-weight: 600; font-variant-numeric: tabular-nums; }
.alerta .qd { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
svg { display: block; width: 100%; height: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
.scroll { overflow-x: auto; }
a { color: var(--accent); }
footer { font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; }
</style>
</head>
<body>
<div id="app"><p class="muted">Carregando…</p></div>
<script>
"use strict";
const fmt = (v) => "R$ " + Math.round(v).toLocaleString("pt-BR");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dm = (s) => s ? s.slice(8, 10) + "/" + s.slice(5, 7) : "";
const dmy = (s) => s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "";
const addDias = (s, n) => { const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diasAte = (s) => Math.ceil((new Date(s + "T12:00:00") - new Date()) / 864e5);
function quando(isoS) { const n = Math.floor((Date.now() - new Date(isoS)) / 36e5); return n < 1 ? "agora há pouco" : n < 24 ? `há ${n} h` : `há ${Math.floor(n / 24)} d`; }
const CORES = { A: "--s1", B: "--s2", C: "--s3", D: "--s4" };

function varint(n) { const o = []; while (n > 127) { o.push((n & 127) | 128); n >>>= 7; } o.push(n); return o; }
function ld(f, b) { return [...varint((f << 3) | 2), ...varint(b.length), ...b]; }
function str(f, s) { return ld(f, Array.from(new TextEncoder().encode(s))); }
function vi(f, v) { return [...varint(f << 3), ...varint(v)]; }
function tfs(legs, trip) { let o = []; for (const [d, a, b] of legs) o.push(...ld(3, [...str(2, d), ...ld(13, [...vi(1, 1), ...str(2, a)]), ...ld(14, [...vi(1, 1), ...str(2, b)])])); o.push(...vi(8, 1), ...vi(9, 1), ...vi(19, trip)); return btoa(String.fromCharCode(...o)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function botoes(legs, multi) {
  const [i, v] = legs, yy = (d) => d.slice(2).replace(/-/g, "");
  const path = multi ? `${i[1]}-${i[2]}/${i[0]}/${v[1]}-${v[2]}/${v[0]}` : `${i[1]}-${i[2]}/${i[0]}/${v[0]}`;
  const l = [["Google", "https://www.google.com/travel/flights/search?tfs=" + tfs(legs, multi ? 3 : 1) + "&hl=pt-BR&gl=BR&curr=BRL"], ["Kayak", `https://www.kayak.com.br/flights/${path}?sort=price_a`], ["Momondo", `https://www.momondo.com.br/flight-search/${path}?sort=price_a`]];
  l.push(["Skyscanner", multi ? "https://www.skyscanner.com.br/" : `https://www.skyscanner.com.br/transporte/passagens-aereas/${i[1].toLowerCase()}/${i[2].toLowerCase()}/${yy(i[0])}/${yy(v[0])}/`]);
  return '<div class="row">' + l.map(([n, u]) => `<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">${n}</a>`).join("") + "</div>";
}
function acoesUrl() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/); const repo = location.pathname.split("/").filter(Boolean)[0];
  return m && repo ? `https://github.com/${m[1]}/${repo}/actions/workflows/buscar.yml` : "https://github.com";
}
function chip(p, teto, melhorJa) {
  if (p == null) return "";
  if (p > teto) return '<span class="pill bad">Acima do teto</span>';
  if (melhorJa != null && p <= melhorJa) return '<span class="pill good">Menor já visto</span>';
  return '<span class="pill ok">Dentro do teto</span>';
}

function render(D, alertas) {
  const C = D.config, B = D.buscas || {}, abreN = C.diasAbertosGoogle || 329;
  const get = (id, f) => B[`${id}|${f}`];
  const melhorJan = (w) => {
    const cands = Object.values(B).filter((b) => b.janela === w.k && (b.tipo === "multi" || b.tipo === "flex") && b.melhor);
    return cands.sort((a, b) => a.melhor.preco - b.melhor.preco)[0] || null;
  };
  const melhores = C.janelas.map((w) => ({ w, b: melhorJan(w) })).filter((x) => x.b).sort((a, b) => a.b.melhor.preco - b.b.melhor.preco);
  const prazo = diasAte(C.prazoPrincipal);
  let h = `<div class="top"><div><h1>Radar China</h1><p class="small muted">${D.atualizado ? "Atualizado " + quando(D.atualizado) : "Ainda não buscou"} · ${D.cotaGoogle ?? "?"}/250 buscas no mês</p></div><a class="btn primary" href="${acoesUrl()}" target="_blank" rel="noopener">Buscar agora</a></div>`;

  h += '<section class="hero">';
  if (melhores.length) {
    const { w, b } = melhores[0];
    h += `<span class="small muted">Melhor ida e volta Brasil ⇄ China agora</span><span class="big">${fmt(b.melhor.preco)}</span>`;
    h += `<div class="row">${chip(b.melhor.preco, C.tetoPrincipal, b.melhorJa)}<span class="small">${esc(w.nome)} · ida ${dm(b.legs[0][0])}, volta ${dm(b.legs[1][0])}${b.melhor.cia ? " · " + esc(b.melhor.cia) : ""}</span></div>`;
  } else {
    const abre = addDias(C.janelas[0].ida, -abreN), n = diasAte(abre);
    h += `<span class="small muted">Melhor ida e volta Brasil ⇄ China agora</span><span class="big" style="font-size:clamp(30px,8vw,42px)">Ainda sem preço</span>`;
    h += `<p class="small muted">${n > 0 ? `O Google abre a Janela 1 por volta de ${dmy(abre)}, em ${n} ${n === 1 ? "dia" : "dias"}.` : "As datas já devem estar abertas. A próxima busca deve trazer preços."}</p>`;
  }
  h += `<p class="small muted">Teto ${fmt(C.tetoPrincipal)} · comprar até ${dmy(C.prazoPrincipal)} (${prazo >= 0 ? prazo + " dias" : "prazo vencido"})</p></section>`;

  h += '<section class="sec"><h2>Janelas</h2><div class="grid">';
  for (const w of C.janelas) {
    const b = melhorJan(w), multi = get(`${w.k}-multi`, "Google Voos");
    const abre = addDias(w.ida, -abreN), fechada = diasAte(abre) > 0;
    const the = [get(`${w.k}-the`, "Google Voos"), get(`${w.k}-the`, "Aviasales")].filter((x) => x && x.melhor).sort((a, c) => a.melhor.preco - c.melhor.preco)[0];
    h += `<article class="jan"><div class="nome"><i style="background:var(${CORES[w.k]})"></i>${esc(w.nome)}</div><div class="datas">Ida ${dm(w.ida)} · volta ${dm(w.volta)} · ${esc(w.tag)}</div>`;
    if (b) h += `<div class="preco">${fmt(b.melhor.preco)}</div><div class="row">${chip(b.melhor.preco, C.tetoPrincipal, b.melhorJa)}${b.tipo === "flex" ? `<span class="pill">datas ${dm(b.legs[0][0])}–${dm(b.legs[1][0])}</span>` : ""}</div>`;
    else h += `<div class="preco muted" style="font-size:22px">${fechada ? "Abre em " + dmy(abre) : "Sem preço ainda"}</div>`;
    h += `<div class="the"><span class="muted">THE ⇄ São Paulo</span>${the ? (the.melhor.preco > C.tetoThe ? `<span class="num" style="color:var(--bad)">${fmt(the.melhor.preco)} · acima do teto</span>` : `<span class="num">${fmt(the.melhor.preco)}</span>`) : "<span>–</span>"}</div>`;
    h += '<details><summary>Detalhes e conferir nos sites</summary><div class="det">';
    if (b && b.melhor) h += `<div class="small muted">${esc([b.melhor.cia, b.melhor.escalas != null ? b.melhor.escalas + " escala(s)" : "", (b.melhor.conexoes || []).join(", ")].filter(Boolean).join(" · "))}</div>`;
    const flex = Object.values(B).filter((x) => x.janela === w.k && x.tipo === "flex" && x.melhor).sort((a, c) => a.melhor.preco - c.melhor.preco).slice(0, 4);
    const linhas = [];
    if (multi && multi.melhor) linhas.push([`Datas do plano (Google)`, fmt(multi.melhor.preco)]);
    for (const f of flex) linhas.push([`Ida ${dm(f.legs[0][0])}, volta ${dm(f.legs[1][0])} (Google)`, fmt(f.melhor.preco)]);
    for (const [id, nome] of [[`${w.k}-pek`, "São Paulo ⇄ Pequim"], [`${w.k}-hkg`, "São Paulo ⇄ Hong Kong"]]) for (const f of ["Google Voos", "Aviasales"]) { const x = get(id, f); if (x && x.melhor) linhas.push([`${nome} (${f === "Google Voos" ? "Google" : "Aviasales"})`, fmt(x.melhor.preco)]); }
    if (b && b.melhorJa) linhas.push(["Menor já visto nesta janela", fmt(b.melhorJa)]);
    h += linhas.length ? '<div>' + linhas.map(([a, v]) => `<div class="lin"><span>${esc(a)}</span><span>${v}</span></div>`).join("") + "</div>" : '<p class="small muted">Nenhum preço registrado ainda.</p>';
    h += '<p class="small muted">Brasil ⇄ China (GRU → Pequim, Hong Kong → GRU):</p>' + botoes([[w.ida, "GRU", "PEK"], [w.volta, "HKG", "GRU"]], true);
    h += '<p class="small muted">Teresina ⇄ São Paulo:</p>' + botoes([[w.theIda, "THE", "GRU"], [w.theVolta, "GRU", "THE"]], false);
    h += "</div></details></article>";
  }
  h += "</div></section>";

  h += '<section class="sec"><h2>Alertas do seu e-mail</h2><div class="card">';
  if (!C.alertasUrl) h += '<p class="small muted">Ainda não conectado. Quando estiver, aparecem aqui os alertas de preço que Kayak, Momondo, Skyscanner e Google mandarem para o seu Gmail.</p>';
  else if (alertas === "carregando") h += '<p class="small muted">Lendo os alertas do seu e-mail…</p>';
  else if (!alertas) h += '<p class="small muted">O Gmail demorou para responder. Recarregue a página em alguns segundos.</p>';
  else if (!alertas.itens.length) h += '<p class="small muted">Nenhum alerta de passagem para a China nos últimos 60 dias. Eles começam quando as datas abrirem e você criar os alertas.</p>';
  else h += alertas.itens.slice(0, 12).map((a) => `<a class="alerta" href="${esc(a.link)}" target="_blank" rel="noopener"><span class="pill">${esc(a.fonte)}</span><span class="as">${esc(a.assunto)}</span><span class="vl">${a.menorPreco ? fmt(a.menorPreco) : ""}</span><span class="qd">${quando(a.quando)} · confira as conexões antes de comprar</span></a>`).join("");
  h += "</div></section>";

  const series = C.janelas.map((w) => ({ w, pts: (D.historico[`${w.k}-multi|Google Voos`] || []) }));
  if (series.some((s) => s.pts.length)) h += `<section class="sec"><h2>Preço ao longo do tempo</h2><div class="card">${grafico(series, C.tetoPrincipal)}</div></section>`;

  const meses = Object.values(D.datasBaratas || {}).filter((x) => x.itens && x.itens.length);
  if (meses.length) h += `<details class="card"><summary>Datas mais baratas em out e nov (Aviasales)</summary><div class="scroll" style="margin-top:8px"><table><thead><tr><th>Rota</th><th>Ida</th><th>Volta</th><th>Preço</th><th></th></tr></thead><tbody>${meses.flatMap((x) => x.itens.map((i) => `<tr><td>${esc(x.rota)}</td><td class="num">${dm(i.ida)}</td><td class="num">${dm(i.volta)}</td><td class="num"><b>${fmt(i.preco)}</b></td><td>${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener">abrir</a>` : ""}</td></tr>`)).join("")}</tbody></table></div></details>`;

  h += `<footer><p>Busca automática todo dia às 7h15 no Google Voos e na Aviasales. Voos com conexão nos EUA, Canadá, México, Austrália ou Nova Zelândia são descartados.</p>${D.log && D.log.length ? `<details><summary>O que a última busca fez</summary><ul>${D.log.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></details>` : ""}</footer>`;
  document.getElementById("app").innerHTML = h;
}
function grafico(series, teto) {
  const todos = series.flatMap((s) => s.pts.map((p) => ({ t: new Date(p.d + "T12:00:00Z").getTime(), v: p.p })));
  const W = Math.max(300, Math.min(880, document.getElementById("app").clientWidth - 34)), H = W < 500 ? 200 : 240, m = { l: 52, r: 44, t: 10, b: 24 };
  let lo = Math.min(...todos.map((p) => p.v)), hi = Math.max(...todos.map((p) => p.v), teto);
  lo = Math.floor((lo - 300) / 500) * 500; hi = Math.ceil((hi + 300) / 500) * 500;
  let t0 = Math.min(...todos.map((p) => p.t)), t1 = Math.max(...todos.map((p) => p.t)); if (t1 - t0 < 2 * 864e5) { t0 -= 864e5; t1 += 864e5; }
  const X = (t) => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r), Y = (v) => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b), passo = (hi - lo) > 4000 ? 1000 : 500;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Preço do bilhete principal ao longo do tempo">`;
  for (let v = lo; v <= hi; v += passo) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${(v / 1000).toLocaleString("pt-BR")} mil</text>`;
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(teto)}" y2="${Y(teto)}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${W - m.r + 4}" y="${Y(teto) + 4}" font-size="11" fill="var(--muted)">Teto</text>`;
  for (const se of series) {
    const pts = se.pts.map((p) => ({ t: new Date(p.d + "T12:00:00Z").getTime(), v: p.p })); if (!pts.length) continue;
    if (pts.length > 1) s += `<polyline fill="none" stroke="var(${CORES[se.w.k]})" stroke-width="2" points="${pts.map((p) => X(p.t) + "," + Y(p.v)).join(" ")}"/>`;
    const u = pts[pts.length - 1]; s += `<circle cx="${X(u.t)}" cy="${Y(u.v)}" r="4.5" fill="var(${CORES[se.w.k]})" stroke="var(--surface)" stroke-width="2"/>`;
  }
  return s + "</svg>" + '<div class="row small muted" style="margin-top:6px">' + series.map((se) => `<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(${CORES[se.w.k]});margin-right:5px"></i>${esc(se.w.nome)}</span>`).join("") + "</div>";
}
(async () => {
  let D;
  try { D = await fetch("dados.json?" + Date.now()).then((r) => r.json()); } catch { document.getElementById("app").innerHTML = '<p class="muted">Não consegui carregar os preços. Recarregue a página.</p>'; return; }
  if (!D.config) { document.getElementById("app").innerHTML = '<div class="hero"><h1>Radar China</h1><p class="muted">A primeira busca ainda não rodou.</p></div>'; return; }
  if (!D.config.alertasUrl) { render(D, null); return; }
  render(D, "carregando");
  for (let i = 0; i < 3; i++) {
    try { const a = await fetch(D.config.alertasUrl).then((r) => r.json()); if (a && Array.isArray(a.itens)) { render(D, a); return; } } catch {}
    await new Promise((ok) => setTimeout(ok, 2000));
  }
  render(D, null);
})();
</script>
</body>
</html>
